name: Android

# Builds the Android phone APK (the main deliverable) and the optional Wear OS APK.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "Shared/Localization/**"
      - "Shared/GymLogos/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LIFTR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LIFTR_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.LIFTR_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIFTR_KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/liftr-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            {
              echo "LIFTR_KEYSTORE_FILE=$KS"
              echo "LIFTR_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "LIFTR_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
              echo "LIFTR_KEY_ALIAS=${KEY_ALIAS:-liftr}"
            } >> "$GITHUB_ENV"
            echo "Signed with the Liftr release key from the repository secrets." >> "$GITHUB_STEP_SUMMARY"
          else
            # No secrets yet: sign with a throwaway key so the APK still installs for testing.
            # APKs signed this way can NOT be installed as an update over each other.
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias liftr -keyalg RSA -keysize 2048 \
              -validity 365 -storepass "$PW" -keypass "$PW" -dname "CN=Liftr test" > /dev/null
            {
              echo "LIFTR_KEYSTORE_FILE=$KS"
              echo "LIFTR_KEYSTORE_PASSWORD=$PW"
              echo "LIFTR_KEY_PASSWORD=$PW"
              echo "LIFTR_KEY_ALIAS=liftr"
            } >> "$GITHUB_ENV"
            echo "::warning::LIFTR_KEYSTORE_* secrets missing: APK signed with a temporary key (not updatable). See android/README.md."
            echo "⚠️ Signed with a TEMPORARY key: set the LIFTR_KEYSTORE_* secrets (android/README.md)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build phone APK
        run: gradle -p android :app:assembleRelease --stacktrace

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: liftr-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build Wear OS APK
        id: wear
        continue-on-error: true
        run: gradle -p android :wear:assembleRelease --stacktrace

      - name: Upload Wear OS APK
        if: steps.wear.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: liftr-wear-apk
          path: android/wear/build/outputs/apk/release/*.apk

      # Artifacts live on storage the build session can't reach, so the APKs are also put on the
      # branch "android-builds" (overwritten every build), where they can be fetched with git.
      - name: Publish APKs to branch android-builds
        run: |
          OUT="$RUNNER_TEMP/apk"
          mkdir -p "$OUT"
          cp android/app/build/outputs/apk/release/*.apk "$OUT/Liftr-android.apk"
          ls android/wear/build/outputs/apk/release/*.apk >/dev/null 2>&1 && cp android/wear/build/outputs/apk/release/*.apk "$OUT/Liftr-wear.apk" || true
          echo "Build ${GITHUB_SHA::7} · $(date -u +%Y-%m-%dT%H:%MZ)" > "$OUT/BUILD.txt"
          cd "$OUT"
          git init -q -b android-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" android-builds
